<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 240" width="100%" height="100%">
  <defs>
    <linearGradient id="rdGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D9FF" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <filter id="rdGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Large Shield Emblem (Left) -->
  <g transform="translate(40, 20)">
    <path d="M 100,20 L 170,45 L 170,115 C 170,150 135,175 100,185 C 65,175 30,150 30,115 L 30,45 Z" 
          fill="#0B1220" 
          stroke="url(#rdGradient)" 
          stroke-width="10" 
          stroke-linejoin="round"
          filter="url(#rdGlow)" />
          
    <!-- Core and circuits -->
    <circle cx="100" cy="100" r="20" fill="#00D9FF" />
    <circle cx="100" cy="100" r="28" fill="none" stroke="rgba(0, 217, 255, 0.4)" stroke-width="3" stroke-dasharray="10 5" />
    
    <path d="M 60,60 L 80,80" stroke="#00D9FF" stroke-width="4.5" fill="none" />
    <circle cx="60" cy="60" r="5" fill="#00D9FF" />
    
    <path d="M 140,60 L 120,80" stroke="#00D9FF" stroke-width="4.5" fill="none" />
    <circle cx="140" cy="60" r="5" fill="#00D9FF" />

    <path d="M 60,140 L 80,120" stroke="#2563EB" stroke-width="4.5" fill="none" />
    <circle cx="60" cy="140" r="5" fill="#00D9FF" />

    <path d="M 140,140 L 120,120" stroke="#2563EB" stroke-width="4.5" fill="none" />
    <circle cx="140" cy="140" r="5" fill="#00D9FF" />
  </g>

  <!-- Large Typography (Right) -->
  <text x="260" y="115" fill="#FFFFFF" font-family="'Inter', 'Segoe UI', sans-serif" font-size="64" font-weight="900" letter-spacing="8">TRACE AI</text>
  <text x="260" y="155" fill="#00D9FF" font-family="'Inter', 'Segoe UI', sans-serif" font-size="18" font-weight="700" letter-spacing="4">DIGITAL FORENSICS &amp; INCIDENT RESPONSE PLATFORM</text>
</svg>
