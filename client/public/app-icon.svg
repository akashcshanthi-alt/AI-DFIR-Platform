<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="aiGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D9FF" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <filter id="aiGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Rounded Rectangle Container -->
  <rect width="512" height="512" rx="112" fill="#0B1220" />
  
  <!-- Subtle inner border gradient -->
  <rect x="12" y="12" width="488" height="488" rx="100" fill="none" stroke="rgba(0, 217, 255, 0.15)" stroke-width="4" />

  <!-- Shield Emblem (Centered) -->
  <g transform="translate(136, 116)">
    <path d="M 120,20 L 210,50 L 210,140 C 210,185 165,220 120,235 C 75,220 30,185 30,140 L 30,50 Z" 
          fill="#050814" 
          stroke="url(#aiGradient)" 
          stroke-width="12" 
          stroke-linejoin="round"
          filter="url(#aiGlow)" />
          
    <circle cx="120" cy="130" r="22" fill="#00D9FF" />
    <circle cx="120" cy="130" r="32" fill="none" stroke="rgba(0, 217, 255, 0.4)" stroke-width="3.5" stroke-dasharray="10 6" />
    
    <line x1="120" y1="50" x2="120" y2="98" stroke="#00D9FF" stroke-width="5" />
    <line x1="40" y1="130" x2="98" y2="130" stroke="#00D9FF" stroke-width="5" />
    <line x1="142" y1="130" x2="200" y2="130" stroke="#2563EB" stroke-width="5" />
  </g>
</svg>
