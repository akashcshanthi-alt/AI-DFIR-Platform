<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <!-- Cyan to Deep Blue main gradient -->
    <linearGradient id="mainGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D9FF" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    
    <!-- Outer glow filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Futuristic Shield -->
  <path d="M 400,100 L 650,200 L 650,480 C 650,620 520,720 400,750 C 280,720 150,620 150,480 L 150,200 Z" 
        fill="none" 
        stroke="url(#mainGradient)" 
        stroke-width="24" 
        stroke-linejoin="round"
        filter="url(#glow)" />
        
  <!-- Inner Shield Border -->
  <path d="M 400,140 L 610,224 L 610,480 C 610,600 500,680 400,710 C 300,680 190,600 190,480 L 190,224 Z" 
        fill="#0B1220" 
        fill-opacity="0.85"
        stroke="rgba(0, 217, 255, 0.25)" 
        stroke-width="8" 
        stroke-linejoin="round" />

  <!-- AI Circuit Patterns & Central CPU Core -->
  <g transform="translate(400, 420)">
    <!-- Circuit Lines -->
    <!-- Top-Left -->
    <path d="M -80,-80 L -150,-150 L -150,-210" stroke="#00D9FF" stroke-width="6" fill="none" opacity="0.8" />
    <circle cx="-150" cy="-210" r="10" fill="#00D9FF" />
    
    <!-- Top-Right -->
    <path d="M 80,-80 L 150,-150 L 210,-150" stroke="#2563EB" stroke-width="6" fill="none" opacity="0.8" />
    <circle cx="210" cy="-150" r="10" fill="#00D9FF" />

    <!-- Bottom-Left -->
    <path d="M -80,80 L -140,140 L -200,140" stroke="#2563EB" stroke-width="6" fill="none" opacity="0.8" />
    <circle cx="-200" cy="140" r="10" fill="#00D9FF" />

    <!-- Bottom-Right -->
    <path d="M 80,80 L 140,140 L 140,210" stroke="#00D9FF" stroke-width="6" fill="none" opacity="0.8" />
    <circle cx="140" cy="210" r="10" fill="#2563EB" />

    <!-- Horizontal Bus -->
    <line x1="-120" y1="0" x2="-60" y2="0" stroke="#00D9FF" stroke-width="6" opacity="0.8" />
    <circle cx="-120" cy="0" r="8" fill="#00D9FF" />
    <line x1="60" y1="0" x2="120" y2="0" stroke="#2563EB" stroke-width="6" opacity="0.8" />
    <circle cx="120" cy="0" r="8" fill="#00D9FF" />

    <!-- CPU Core -->
    <rect x="-60" y="-60" width="120" height="120" rx="15" fill="#0B1220" stroke="url(#mainGradient)" stroke-width="12" />
    
    <!-- CPU Inner Core Grid Pattern -->
    <rect x="-40" y="-40" width="80" height="80" rx="8" fill="rgba(0, 217, 255, 0.15)" stroke="#00D9FF" stroke-width="4" />
    
    <!-- Central Glowing Node -->
    <circle cx="0" cy="0" r="16" fill="url(#mainGradient)" />
    
    <!-- Circuit Tracks on Core -->
    <line x1="-40" y1="-20" x2="40" y2="-20" stroke="rgba(255,255,255,0.4)" stroke-width="2" />
    <line x1="-40" y1="0" x2="40" y2="0" stroke="rgba(255,255,255,0.4)" stroke-width="2" />
    <line x1="-40" y1="20" x2="40" y2="20" stroke="rgba(255,255,255,0.4)" stroke-width="2" />
    
    <line x1="-20" y1="-40" x2="-20" y2="40" stroke="rgba(255,255,255,0.4)" stroke-width="2" />
    <line x1="0" y1="-40" x2="0" y2="40" stroke="rgba(255,255,255,0.4)" stroke-width="2" />
    <line x1="20" y1="-40" x2="20" y2="40" stroke="rgba(255,255,255,0.4)" stroke-width="2" />
  </g>
</svg>
